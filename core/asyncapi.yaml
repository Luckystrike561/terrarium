# NOTE: pinned to 3.0.0 deliberately. @asyncapi/modelina v5.10.1 hardcodes
# `supportedVersions: ['3.0.0']` in its AsyncAPIInputProcessor. Bumping to
# 3.1.0 makes Modelina fall through to a generic JSON-schema parser that emits
# only `export type Root = any` instead of our 52 named interfaces. Bump when
# Modelina adds 3.1.0 support; the upgrade is `npx asyncapi convert` + a regen.
# `npm run asyncapi:validate` will keep emitting an info note recommending 3.1.0;
# that's expected and harmless until Modelina catches up.
asyncapi: 3.0.0
info:
  title: Terrarium Protocol
  version: 1.0.0
  description: |
    Bidirectional WebSocket protocol between the Terrarium server and any UI client
    (the standalone browser SPA, or future third-party clients). The server watches
    AI-coding-agent transcripts, parses tool activity, owns office layout, and streams
    events to all connected clients. Clients send commands to close agents, save
    seat assignments and area mappings, and answer the hooks consent dialog.

    The protocol is provider-agnostic: a HookProvider implementation defines how raw
    CLI events are normalized to the AgentEvent shape, which the server translates
    into ServerMessage broadcasts.
  license:
    name: MIT
  contact:
    name: Terrarium
    url: https://github.com/Luckystrike561/terrarium

servers:
  local:
    host: 127.0.0.1:3100
    protocol: ws
    description: Local Terrarium server (default port 3100)
    pathname: /ws

channels:
  ws:
    address: /ws
    description: |
      Single bidirectional channel. The server pushes ServerMessage events on agent
      lifecycle, tool activity, asset loading, and settings. Clients send
      ClientMessage commands.
    messages:
      ServerMessage:
        $ref: '#/components/messages/ServerMessage'
      ClientMessage:
        $ref: '#/components/messages/ClientMessage'

operations:
  receiveServerMessage:
    action: receive
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ServerMessage'
  sendClientMessage:
    action: send
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ClientMessage'

components:
  messages:
    ServerMessage:
      title: Server-to-client message
      summary: Any message broadcast by the server to connected clients.
      payload:
        $ref: '#/components/schemas/ServerMessage'
    ClientMessage:
      title: Client-to-server message
      summary: Any command sent by a client to the server.
      payload:
        $ref: '#/components/schemas/ClientMessage'

  schemas:
    # ── Top-level discriminated unions ────────────────────────────

    ServerMessage:
      oneOf:
        # Provider capabilities
        - $ref: '#/components/schemas/ProviderCapabilities'
        # Agent lifecycle
        - $ref: '#/components/schemas/AgentCreated'
        - $ref: '#/components/schemas/AgentClosed'
        - $ref: '#/components/schemas/ExistingAgents'
        # Agent status / tool activity
        - $ref: '#/components/schemas/AgentStatus'
        - $ref: '#/components/schemas/AgentToolStart'
        - $ref: '#/components/schemas/AgentToolDone'
        - $ref: '#/components/schemas/AgentToolsClear'
        - $ref: '#/components/schemas/AgentToolPermission'
        - $ref: '#/components/schemas/AgentToolPermissionClear'
        # Sub-agent activity
        - $ref: '#/components/schemas/SubagentToolStart'
        - $ref: '#/components/schemas/SubagentToolDone'
        - $ref: '#/components/schemas/SubagentClear'
        - $ref: '#/components/schemas/SubagentToolPermission'
        # Agent Teams
        - $ref: '#/components/schemas/AgentTeamInfo'
        # Context window
        - $ref: '#/components/schemas/AgentContextUsage'
        - $ref: '#/components/schemas/AgentInfo'
        # Layout
        - $ref: '#/components/schemas/LayoutLoaded'
        # Assets
        - $ref: '#/components/schemas/FurnitureAssetsLoaded'
        - $ref: '#/components/schemas/CharacterSpritesLoaded'
        - $ref: '#/components/schemas/PetSpritesLoaded'
        - $ref: '#/components/schemas/FloorTilesLoaded'
        - $ref: '#/components/schemas/WallTilesLoaded'
        - $ref: '#/components/schemas/CarpetTilesLoaded'
        # Settings & config
        - $ref: '#/components/schemas/SettingsLoaded'
        - $ref: '#/components/schemas/HooksStatus'
        - $ref: '#/components/schemas/HooksConsentRequest'
        - $ref: '#/components/schemas/AreaMappingsLoaded'
        # Connections
        - $ref: '#/components/schemas/ConnectionsLoaded'
        - $ref: '#/components/schemas/ConnectionAddResult'
        # Quotas
        - $ref: '#/components/schemas/QuotaUpdate'
      discriminator: type

    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/WebviewReady'
        - $ref: '#/components/schemas/CloseAgent'
        - $ref: '#/components/schemas/SaveAgentSeats'
        - $ref: '#/components/schemas/SetLastSeenVersion'
        - $ref: '#/components/schemas/HooksConsentResponse'
        - $ref: '#/components/schemas/SetHooksInfoShown'
        - $ref: '#/components/schemas/SaveAreaMappings'
        - $ref: '#/components/schemas/AddConnection'
        - $ref: '#/components/schemas/UpdateConnection'
        - $ref: '#/components/schemas/RemoveConnection'
      discriminator: type

    # ── Server message variants ────────────────────────────────────

    ProviderCapabilities:
      description: |
        Sent once after `webviewReady`, before any agent messages. Lists the tool
        taxonomy of every enabled agent module: which tool names render with the
        "reading" animation and which spawn sub-agent characters. Characters do not
        carry their module, so the client classifies a tool name against all of them.
      type: object
      additionalProperties: false
      required: [type, providers]
      properties:
        type:
          const: providerCapabilities
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderToolTaxonomy'

    AgentCreated:
      description: A new agent has appeared in the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentCreated
        id:
          type: integer
        folderName:
          type: string
        palette:
          type: integer
          description: Server-assigned character palette index.
        hueShift:
          type: integer
          description: Server-assigned hue shift in degrees (0-360).

    AgentClosed:
      description: An agent has been removed from the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentClosed
        id:
          type: integer

    ExistingAgents:
      description: |
        Snapshot of all current agents. Sent on initial connect and after agent set
        changes that the client missed. Includes seat/palette assignments.
      type: object
      additionalProperties: false
      required: [type, agents, agentMeta, folderNames]
      properties:
        type:
          const: existingAgents
        agents:
          type: array
          items:
            type: integer
        agentMeta:
          type: object
          description: Map of agent ID (string) to seat metadata.
          additionalProperties:
            $ref: '#/components/schemas/AgentSeatMeta'
        folderNames:
          type: object
          description: Map of agent ID (string) to workspace folder name.
          additionalProperties:
            type: string

    AgentStatus:
      description: Active vs waiting state for an agent (drives character animation).
      type: object
      additionalProperties: false
      required: [type, id, status]
      properties:
        type:
          const: agentStatus
        id:
          type: integer
        status:
          $ref: '#/components/schemas/AgentActivityStatus'
        awaitingInput:
          type: boolean
          description: >-
            Only meaningful when status is "waiting". True when the agent went
            idle waiting on the user (drives the "Waiting for input" label);
            absent/false means the agent finished its turn ("Done").

    AgentActivityStatus:
      description: Activity state of an agent.
      type: string
      enum: [active, waiting]

    AgentToolStart:
      description: Agent began executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId, status]
      properties:
        type:
          const: agentToolStart
        id:
          type: integer
        toolId:
          type: string
        status:
          type: string
          description: Human-readable status to display (e.g. "Reading foo.ts").
        toolName:
          type: string
        permissionActive:
          type: boolean
        runInBackground:
          type: boolean
        isTeammateSpawn:
          type: boolean
          description: >-
            True when this spawn tool call carries a name, making the spawn a
            Teammate-to-be. The office must not create a Subtask sub-character
            for it — a teammate character will represent the spawn instead.

    AgentToolDone:
      description: Agent finished executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId]
      properties:
        type:
          const: agentToolDone
        id:
          type: integer
        toolId:
          type: string

    AgentToolsClear:
      description: All foreground tools cleared (turn end). Background agents preserved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolsClear
        id:
          type: integer

    AgentToolPermission:
      description: Permission prompt detected for the agent's current tool.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermission
        id:
          type: integer

    AgentToolPermissionClear:
      description: Permission prompt resolved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermissionClear
        id:
          type: integer

    SubagentToolStart:
      description: Sub-agent (e.g. Task) started a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId, status]
      properties:
        type:
          const: subagentToolStart
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string
        status:
          type: string

    SubagentToolDone:
      description: Sub-agent finished a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId]
      properties:
        type:
          const: subagentToolDone
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string

    SubagentClear:
      description: A sub-agent task completed.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentClear
        id:
          type: integer
        parentToolId:
          type: string

    SubagentToolPermission:
      description: Permission prompt for a sub-agent's tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentToolPermission
        id:
          type: integer
        parentToolId:
          type: string

    AgentTeamInfo:
      description: Agent Teams metadata (lead, teammate, tmux usage).
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentTeamInfo
        id:
          type: integer
        teamName:
          type: string
        agentName:
          type: string
        isTeamLead:
          type: boolean
        leadAgentId:
          type: integer
        teamUsesTmux:
          type: boolean

    AgentContextUsage:
      description: |
        How much of the agent's context window is in use, as of its most recent
        turn. A snapshot, NOT a running total: it falls when the session
        compacts or clears. `maxContextTokens` is the runtime's best estimate of
        the window size — transcripts don't state it, so it starts at the
        default and widens (never shrinks) once a larger context is observed.
        Sent for every agent, including leads and teammates; sub-agents have no
        session of their own and never report it.
      type: object
      additionalProperties: false
      required: [type, id, contextTokens, maxContextTokens]
      properties:
        type:
          const: agentContextUsage
        id:
          type: integer
        contextTokens:
          type: integer
        maxContextTokens:
          type: integer

    AgentInfo:
      description: |
        Provider-supplied identity for an agent: `name` replaces the folder
        label under the character, `task` is a one-line summary of what it is
        working on. Either field may be absent; an absent field is unchanged.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentInfo
        id:
          type: integer
        name:
          type: string
        task:
          type: string

    LayoutLoaded:
      description: |
        Office layout (tiles, furniture, colors). `null` when no layout file or
        bundled default exists. `wasReset` is true when the bundled default
        replaced an outdated user layout.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: layoutLoaded
        layout:
          oneOf:
            - type: object
              description: |
                Opaque layout object (cols, rows, tiles, furniture, tileColors).
                Format defined by the OfficeLayout schema in webview-ui; not
                modeled here because it's owned by the rendering layer.
            - type: 'null'
        wasReset:
          type: boolean

    FurnitureAssetsLoaded:
      description: Furniture catalog and sprite data, sent once after webviewReady.
      type: object
      additionalProperties: false
      required: [type, catalog, sprites]
      properties:
        type:
          const: furnitureAssetsLoaded
        catalog:
          type: array
          items:
            $ref: '#/components/schemas/FurnitureAssetMessage'
        sprites:
          type: object
          description: Map of furniture asset ID to its sprite (2D hex string array).
          additionalProperties:
            type: array
            items:
              type: array
              items:
                type: string

    CharacterSpritesLoaded:
      description: Pre-colored character sprite sets (one per agent palette) and the CTO's own set, sent once at startup.
      type: object
      additionalProperties: false
      required: [type, characters, cto]
      properties:
        type:
          const: characterSpritesLoaded
        characters:
          type: array
          items:
            $ref: '#/components/schemas/CharacterSpriteSet'
        cto:
          $ref: '#/components/schemas/CharacterSpriteSet'

    PetSpritesLoaded:
      description: Pet sprite frame sets and display names, sent once after webviewReady (between characterSpritesLoaded and floorTilesLoaded).
      type: object
      additionalProperties: false
      required: [type, pets, petNames]
      properties:
        type:
          const: petSpritesLoaded
        pets:
          type: array
          description: One frame-set per loaded pet, indexed by petType.
          items:
            $ref: '#/components/schemas/PetSpriteFrameSet'
        petNames:
          type: array
          description: Display names parallel-indexed to `pets` (sourced from each pet's manifest.json).
          items:
            type: string

    PetSpriteFrameSet:
      description: One pet's frames keyed by direction + state. All arrays are 3D hex-string arrays (frames × rows × pixels).
      type: object
      additionalProperties: false
      required: [walkDown, idleDown, walkUp, idleUp, walkRight]
      properties:
        walkDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkRight:
          type: array
          description: 3 frames at 32×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FloorTilesLoaded:
      description: Floor tile sprites (7 patterns).
      type: object
      additionalProperties: false
      required: [type, sprites]
      properties:
        type:
          const: floorTilesLoaded
        sprites:
          type: array
          description: Array of 2D hex string arrays (one per pattern).
          items:
            type: array
            items:
              type: array
              items:
                type: string

    WallTilesLoaded:
      description: Wall auto-tile sprite sets (16 bitmask pieces).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: wallTilesLoaded
        sets:
          type: array
          description: Array of wall tile sets; each set is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    CarpetTilesLoaded:
      description: Carpet auto-tile sprite sets (16 marching-squares pieces per variant).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: carpetTilesLoaded
        sets:
          type: array
          description: Array of carpet variants; each variant is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    SettingsLoaded:
      description: All persisted user-level settings, sent once on connect.
      type: object
      additionalProperties: false
      required:
        - type
        - lastSeenVersion
        - extensionVersion
        - hooksEnabled
        - hooksInfoShown
      properties:
        type:
          const: settingsLoaded
        lastSeenVersion:
          type: string
        extensionVersion:
          type: string
        hooksEnabled:
          type: boolean
        hooksInfoShown:
          type: boolean

    HooksStatus:
      description: |
        Actual hook installation state, as opposed to the hooksEnabled
        preference in SettingsLoaded. The two can disagree: hooksEnabled
        defaults to true while first-run consent is still pending and nothing
        is installed yet. Sent after the connect handshake and whenever the
        install state changes (consent granted, hooks uninstalled via CLI).
      type: object
      additionalProperties: false
      required: [type, providerId, subjectId, installed]
      properties:
        type:
          const: hooksStatus
        providerId:
          type: string
          description: >-
            The hook provider this install state is about (HookProvider.id,
            e.g. "claude"). Consumers keyed on install state must never mix
            one provider's status into another's — the Intro's install
            verdict in particular reads only the (provider, subject) pair it
            asked about.
        subjectId:
          type: string
          description: >-
            The subject of that provider's install this status is about
            (HookInstaller.id, e.g. "hooks" or "statusLine" for Claude).
            Independently consented and independently installed: one
            subject's status says nothing about another's.
        installed:
          type: boolean

    HooksConsentRequest:
      description: |
        Ask this client to run the first-run hooks consent dialog. Sent during the
        `webviewReady` handshake when the subject's preference is on, consent has
        not been recorded, and nothing of it is installed — and, in standalone,
        only on privileged (tokened) connections, since an untokened spectator
        could not act on it anyway (its `hooksConsentResponse` would be ignored).

        Carries the (provider, subject) pair being asked about and its disclosure
        copy so the client renders the server's exact terms (the subject's
        consentDisclosure(), shared with no client-side duplicate to drift).
        The client answers with `hooksConsentResponse`, echoing the providerId and
        subjectId; dismissing the dialog sends nothing and the request fires again
        on the next connect. One request per (provider, subject) pair that needs
        an answer.
      type: object
      additionalProperties: false
      required: [type, providerId, subjectId, headline, disclosure, actionLabel]
      properties:
        type:
          const: hooksConsentRequest
        providerId:
          type: string
          description: >-
            The hook provider whose subject is being approved (HookProvider.id).
            The client never originates this value — it echoes it back in its
            `hooksConsentResponse`.
        subjectId:
          type: string
          description: >-
            The subject of that provider's install being approved
            (HookInstaller.id). The client never originates this value either —
            it echoes it back beside providerId. Two subjects of the same
            provider are two independent asks, never the same tour revised.
        headline:
          type: string
          description: One-sentence summary of what is being approved.
        disclosure:
          type: string
          description: |
            Full disclosure body (what is written, what data moves, how to undo),
            paragraphs separated by blank lines.
        actionLabel:
          type: string
          description: >-
            The consent step's Install button text (e.g. "Install Hooks",
            "Install Status Line"), so the client never hardcodes copy that
            could lie about what a different subject's ask installs.

    AreaMappingsLoaded:
      description: |
        Workspace-folder-to-Area mappings. Folder names map to one or more Area
        labels; new agents from that folder prefer seats inside those Areas.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: areaMappingsLoaded
        mappings:
          type: object
          description: Map of folder name (string) to array of Area labels.
          additionalProperties:
            type: array
            items:
              type: string

    ConnectionsLoaded:
      description: |
        Every herdr server the office listens to, with its live state. Sent on
        connect and again whenever a connection is added, edited, removed or
        changes state. Privileged (tokened) connections only: the list names
        SSH targets, and only those clients can change it.
      type: object
      additionalProperties: false
      required: [type, connections]
      properties:
        type:
          const: connectionsLoaded
        connections:
          type: array
          items:
            $ref: '#/components/schemas/Connection'

    ConnectionAddResult:
      description: |
        Outcome of one `addConnection`, sent to the client that asked. The
        connection is saved only when the server reached herdr through it
        (a `ping` round-trip); otherwise `error` carries the SSH or herdr
        error text and nothing is saved.
      type: object
      additionalProperties: false
      required: [type, requestId]
      properties:
        type:
          const: connectionAddResult
        requestId:
          type: string
          description: Echo of the `addConnection.requestId` this answers.
        error:
          type: string
          description: Why the connection was not saved. Absent on success.

    QuotaUpdate:
      description: |
        Every account quota meter the office knows, the full list each time.
        Sent on connect and whenever a reading arrives or goes stale. An empty
        list means no source reports, and the office draws nothing.
      type: object
      additionalProperties: false
      required: [type, meters]
      properties:
        type:
          const: quotaUpdate
        meters:
          type: array
          items:
            $ref: '#/components/schemas/QuotaMeter'

    # ── Client message variants ────────────────────────────────────

    WebviewReady:
      description: Client signals it's ready to receive state.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: webviewReady

    CloseAgent:
      description: Close (dismiss) an agent.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: closeAgent
        id:
          type: integer

    SaveAgentSeats:
      description: Persist seat assignments for current agents.
      type: object
      additionalProperties: false
      required: [type, seats]
      properties:
        type:
          const: saveAgentSeats
        seats:
          type: object
          description: Map of agent ID (string) to seat assignment.
          additionalProperties:
            $ref: '#/components/schemas/SeatAssignment'

    SetLastSeenVersion:
      type: object
      additionalProperties: false
      required: [type, version]
      properties:
        type:
          const: setLastSeenVersion
        version:
          type: string

    HooksConsentResponse:
      description: |
        The user's answer to `hooksConsentRequest` — an ABSOLUTE statement of
        the state the user wants, revisable from the Intro's closing step. Only
        an exact `install` grants consent and installs; only an exact `never`
        records a durable decline and persists this subject off (uninstalling
        first when it is on disk from an earlier answer).
        `notNow` writes nothing on a fresh ask, but over anything an EARLIER
        answer left behind it reverts it — uninstalling a landed install,
        clearing a recorded grant or decline — so the ask genuinely returns on
        the next connect. Any unrecognized value writes NOTHING and the user is
        asked again — a malformed choice must never be read as approval, a
        durable decline, or an uninstall trigger. The server ignores this
        message on unprivileged standalone connections, which were never sent
        the request.
      type: object
      additionalProperties: false
      required: [type, providerId, subjectId, choice]
      properties:
        type:
          const: hooksConsentResponse
        providerId:
          type: string
          description: >-
            The provider this answer is about, echoed verbatim from the
            `hooksConsentRequest` that solicited it. An id naming no
            registered provider is treated exactly like a junk choice:
            write nothing.
        subjectId:
          type: string
          description: >-
            The subject of that provider this answer is about, echoed verbatim
            from the `hooksConsentRequest` that solicited it. An id naming no
            subject of the provider is treated exactly like a junk choice:
            write nothing. Answering one subject never writes another's.
        choice:
          $ref: '#/components/schemas/HooksConsentChoice'

    HooksConsentChoice:
      description: >-
        The three consent outcomes. Receivers must treat any other value as a
        no-op: write nothing, ask again. (An exact notNow itself is a no-op
        only on a fresh ask — over an earlier answer it is a revision that
        undoes what that answer left behind.)
      type: string
      enum: [install, notNow, never]

    SetHooksInfoShown:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: setHooksInfoShown

    SaveAreaMappings:
      description: Persist folder-to-Area mappings for seat assignment.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: saveAreaMappings
        mappings:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    AddConnection:
      description: |
        Add a herdr server to listen to. The server checks it with a `ping`
        round-trip before saving, then answers with `connectionAddResult`.
        Privileged: an `ssh` connection makes the server open SSH sessions to
        another machine, so untokened clients are refused.
      type: object
      additionalProperties: false
      required: [type, requestId, label, kind]
      properties:
        type:
          const: addConnection
        requestId:
          type: string
          description: Client-chosen id echoed in `connectionAddResult`.
        label:
          type: string
          maxLength: 64
        kind:
          $ref: '#/components/schemas/ConnectionKind'
        target:
          type: string
          maxLength: 255
          pattern: '^(?:[A-Za-z0-9_][A-Za-z0-9._@-]*@)?(?:[A-Za-z0-9][A-Za-z0-9._-]*|[0-9A-Fa-f]*:[0-9A-Fa-f:.]*)$|^ssh://(?:[A-Za-z0-9_][A-Za-z0-9._-]*@)?(?:[A-Za-z0-9][A-Za-z0-9._-]*|\[[0-9A-Fa-f:.]+\])(?::[0-9]{1,5})?$'
          description: >-
            SSH destination for an `ssh` connection: `host`, `user@host`, a
            bare IPv6 address, `ssh://user@host:2222` or an SSH config alias.
            Nothing outside destination syntax, since OpenSSH substitutes it
            unquoted into ssh_config `%h`/`%r`.
        session:
          type: string
          maxLength: 64
          description: herdr session name. Absent means herdr's default session.

    UpdateConnection:
      description: Rename a connection or turn it on or off. Privileged, like `addConnection`.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: updateConnection
        id:
          type: string
        label:
          type: string
          maxLength: 64
        enabled:
          type: boolean

    RemoveConnection:
      description: Stop listening to a connection and forget it. Privileged, like `addConnection`.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: removeConnection
        id:
          type: string

    # ── Supporting schemas ─────────────────────────────────────────

    AgentSeatMeta:
      description: |
        Seat metadata associated with an agent (palette index, hue shift, seat ID).
        Used in `existingAgents.agentMeta`. All fields optional because some agents
        may not have a seat assignment yet.
      type: object
      additionalProperties: false
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: string

    SeatAssignment:
      description: |
        Required seat assignment payload sent in `saveAgentSeats`. `seatId` may be
        null when the agent is unseated (left their chair). All other fields required.
      type: object
      additionalProperties: false
      required: [palette, hueShift, seatId]
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: [string, 'null']

    ProviderToolTaxonomy:
      description: One agent module's tool taxonomy, carried in `providerCapabilities`.
      type: object
      additionalProperties: false
      required: [providerId, readingTools, subagentToolNames]
      properties:
        providerId:
          type: string
        readingTools:
          type: array
          items:
            type: string
          description: Tool names that should render the reading animation (vs typing).
        subagentToolNames:
          type: array
          items:
            type: string
          description: Tool names that spawn sub-agent characters (e.g. Task, Agent).

    CharacterSpriteSet:
      description: |
        One character's sprites as 3D hex-string arrays (frames × rows × pixels), frames in sheet order.
        Three direction sets: down, up, right (left is rendered as the mirrored up set).
      type: object
      additionalProperties: false
      required: [down, up, right]
      properties:
        down:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        up:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        right:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FurnitureAssetMessage:
      description: One entry in the furniture catalog (sent in `furnitureAssetsLoaded`).
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - label
        - category
        - file
        - width
        - height
        - footprintW
        - footprintH
        - isDesk
        - canPlaceOnWalls
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
        category:
          type: string
        file:
          type: string
        width:
          type: integer
        height:
          type: integer
        footprintW:
          type: integer
        footprintH:
          type: integer
        isDesk:
          type: boolean
        canPlaceOnWalls:
          type: boolean
        groupId:
          type: string
        canPlaceOnSurfaces:
          type: boolean
        backgroundTiles:
          type: integer
        orientation:
          type: string
        state:
          type: string
        mirrorSide:
          type: boolean
        rotationScheme:
          type: string
        animationGroup:
          type: string
        frame:
          type: integer

    Connection:
      description: |
        One herdr server the office listens to. Its agents join the same office
        as every other agent; their session ids carry the connection id, so
        equal pane ids on two servers stay two characters.
      type: object
      additionalProperties: false
      required: [id, label, kind, enabled, state]
      properties:
        id:
          type: string
        label:
          type: string
        kind:
          $ref: '#/components/schemas/ConnectionKind'
        target:
          type: string
          description: SSH destination, set for `ssh` connections only.
        session:
          type: string
          description: herdr session name. Absent means herdr's default session.
        enabled:
          type: boolean
        state:
          $ref: '#/components/schemas/ConnectionState'
        message:
          type: string
          description: Last error from SSH or herdr, set while the state is `error` or `reconnecting`.

    ConnectionKind:
      description: >-
        `local` reaches herdr on this machine through its socket. `ssh`
        forwards the remote herdr socket over OpenSSH.
      type: string
      enum: [local, ssh]

    ConnectionState:
      description: >-
        `connecting` before the first answer, `connected` while herdr answers,
        `reconnecting` after a connection that worked was lost, `error` when an
        attempt failed (retried in the background), `disabled` when turned off.
      type: string
      enum: [connecting, connected, reconnecting, error, disabled]

    QuotaMeter:
      description: |
        One account quota (Claude's 5-hour window, a monthly credit), as its
        source last read it.
      type: object
      additionalProperties: false
      required: [id, providerId, label, observedAt, stale]
      properties:
        id:
          type: string
          description: '`<providerId>:<meter id>`, unique across sources.'
        providerId:
          type: string
          description: The module that reports the meter.
        label:
          type: string
        usedFraction:
          type: number
          description: |
            Share of the quota used, 0 to 1, above 1 when over the limit.
            Absent when the source cannot read the meter: shown as unavailable,
            never as empty or full.
        usedAmount:
          type: number
          description: Amount used, for a meter measured against a limit.
        limitAmount:
          type: number
          description: The limit `usedAmount` counts against.
        unit:
          $ref: '#/components/schemas/QuotaUnit'
        resetsAt:
          type: integer
          description: Epoch ms when the provider resets the meter.
        observedAt:
          type: integer
          description: Epoch ms when the source took the reading.
        stale:
          type: boolean
          description: |
            No fresh reading within the source's expected interval, or the
            reading belongs to a window that has since reset.

    QuotaUnit:
      description: What `usedAmount` and `limitAmount` count.
      type: string
      enum: [usd, tokens, requests]

<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0d1117" />
		<meta name="color-scheme" content="dark" />
		<meta name="referrer" content="no-referrer" />
		<title>Terrarium</title>
		<link rel="stylesheet" href="/src/style.css" />
	</head>
	<body>
		<header class="topbar">
			<h1>Terrarium</h1>
			<div id="status" class="status" data-state="connecting" role="status" aria-live="polite">
				<span class="status-dot" aria-hidden="true"></span>
				<span id="status-text">Connecting</span>
			</div>
		</header>
		<form id="token-form" class="token-form" hidden>
			<label for="token-input">View token</label>
			<input id="token-input" type="password" autocomplete="off" spellcheck="false" required />
			<button type="submit">Connect</button>
		</form>
		<main>
			<section aria-labelledby="usage-title">
				<h2 id="usage-title">Usage</h2>
				<div class="table-wrap">
					<table id="usage" class="usage"></table>
				</div>
			</section>
			<section aria-labelledby="agents-title">
				<h2 id="agents-title">Hosts and agents</h2>
				<div class="table-wrap">
					<table id="agents" class="agents"></table>
				</div>
			</section>
		</main>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>

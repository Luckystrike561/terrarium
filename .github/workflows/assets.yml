name: Assets

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate the office manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate the bundled sheets against the manifest
        run: npm run assets:validate

      - name: Check the generated art and manifest are up to date
        run: |
          npm run assets:generate
          git status --porcelain webview-ui/public/assets
          test -z "$(git status --porcelain webview-ui/public/assets)"

      - name: Check that corrupted sheets are caught
        working-directory: server
        run: npx vitest run __tests__/officeManifest.test.ts
